<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {{ page.title }} — Diamond Dust
    </title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>


<body>

    <div class="reading-progress" aria-hidden="true">
    <div class="reading-progress-bar"></div>
</div>

    <header class="site-header">

        <div class="container header-inner">

            <a href="{{ '/' | relative_url }}" class="site-logo">
                Diamond Dust
            </a>

            <nav class="site-nav" aria-label="Main navigation">

                <a href="{{ '/' | relative_url }}">
                    Home
                </a>

                <a href="{{ '/#chapters' | relative_url }}">
                    Chapters
                </a>

                <a href="{{ '/#about' | relative_url }}">
                    About
                </a>

            </nav>

        </div>

    </header>


    <main class="chapter-page">

        <article class="chapter">

            <header class="chapter-header">

                <p class="chapter-volume">
                    {{ page.volume }}
                </p>

                <p class="chapter-number">
                    Chapter {{ page.chapter_number }}
                </p>

                <h1>
                    {{ page.title }}
                </h1>

                {% if page.korean_title %}
                    <p class="chapter-korean-title">
                        {{ page.korean_title }}
                    </p>
                {% endif %}

            </header>


            <div class="chapter-content">

                {{ content }}

            </div>

        </article>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                Diamond Dust
            </p>

        </div>

    </footer>

<a href="#" class="back-to-top" aria-label="Back to top">
    ↑
</a>

    <script>

    const progressBar = document.querySelector(".reading-progress-bar");
    const backToTop = document.querySelector(".back-to-top");

    function updateReadingUI() {

        const scrollTop = window.scrollY;
        const documentHeight =
            document.documentElement.scrollHeight - window.innerHeight;

        const progress =
            documentHeight > 0
                ? (scrollTop / documentHeight) * 100
                : 0;

        progressBar.style.width = progress + "%";


        if (scrollTop > 500) {
            backToTop.classList.add("visible");
        } else {
            backToTop.classList.remove("visible");
        }

    }

    window.addEventListener("scroll", updateReadingUI);

    updateReadingUI();

</script>

</body>

</html>
