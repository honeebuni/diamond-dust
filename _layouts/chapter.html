<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ page.title }} | Diamond Dust
    </title>

    <link
        rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}"
    >

</head>


<body>

    <header class="site-header">

        <div class="container header-inner">

            <a href="{{ '/' | relative_url }}" class="site-logo">
                Diamond Dust
            </a>

            <nav class="site-nav" aria-label="Main navigation">

                <a href="{{ '/' | relative_url }}">
                    Home
                </a>

                <a href="{{ '/#chapters' | relative_url }}">
                    Chapters
                </a>

                <a href="{{ '/#about' | relative_url }}">
                    About
                </a>

            </nav>

        </div>

    </header>


    <main>

        <article class="chapter-page">

            <header class="chapter-header">

                <div class="container">

                    <p class="section-label">
                        {{ page.volume }}
                    </p>

                    <h1>
                        {{ page.title }}
                    </h1>

                    {% if page.subtitle %}
                        <p class="chapter-subtitle">
                            {{ page.subtitle }}
                        </p>
                    {% endif %}

                </div>

            </header>


            <div class="container">

                <div class="chapter-content">

                    {{ content }}

                </div>


                <nav
                    class="chapter-navigation"
                    aria-label="Chapter navigation"
                >

                    {% if page.previous_chapter %}
                        <a
                            href="{{ page.previous_chapter | relative_url }}"
                            class="chapter-nav-link"
                        >
                            ← Previous
                        </a>
                    {% else %}
                        <span></span>
                    {% endif %}


                    <a
                        href="{{ '/#chapters' | relative_url }}"
                        class="chapter-nav-link chapter-index"
                    >
                        All Chapters
                    </a>


                    {% if page.next_chapter %}
                        <a
                            href="{{ page.next_chapter | relative_url }}"
                            class="chapter-nav-link"
                        >
                            Next →
                        </a>
                    {% else %}
                        <span></span>
                    {% endif %}

                </nav>

            </div>

        </article>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                Diamond Dust
            </p>

        </div>

    </footer>

</body>

</html>
